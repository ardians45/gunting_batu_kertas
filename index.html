<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detektor Gestur Tangan AI</title>
    <link href="./src/output.css" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <meta name="color-scheme" content="light only" />
  </head>
  <body
    class="min-h-screen bg-stone-50 text-stone-800 font-sans antialiased p-4"
  >
    <div
      class="w-full max-w-7xl mx-auto bg-white rounded-2xl shadow-sm ring-1 ring-stone-200 overflow-hidden"
    >
      <div class="flex flex-col md:flex-row">
        <aside
          class="md:w-16 border-b md:border-b-0 md:border-r border-stone-200 bg-white"
        >
          <div
            class="p-4 flex md:flex-col items-center justify-between md:justify-start gap-4 md:gap-8"
          >
            <div class="text-stone-700 text-2xl md:text-3xl" aria-hidden="true">
              <i class="fas fa-hand-sparkles"></i>
            </div>
            <nav
              class="flex md:flex-col items-center gap-3 md:gap-4"
              aria-label="Navigasi utama"
            >
              <a
                href="#"
                class="group inline-flex items-center justify-center size-10 rounded-lg bg-stone-100 text-stone-900 ring-1 ring-stone-200"
                title="Analisis Langsung"
                aria-current="page"
              >
                <span class="sr-only">Analisis Langsung</span>
                <i class="fas fa-video text-lg"></i>
              </a>
              <a
                href="#"
                class="group inline-flex items-center justify-center size-10 rounded-lg text-stone-500 hover:text-stone-900 hover:bg-stone-100 ring-1 ring-transparent hover:ring-stone-200 transition-colors"
                title="Dasbor"
              >
                <span class="sr-only">Dasbor</span>
                <i class="fas fa-chart-bar text-lg"></i>
              </a>
              <a
                href="#"
                class="group inline-flex items-center justify-center size-10 rounded-lg text-stone-500 hover:text-stone-900 hover:bg-stone-100 ring-1 ring-transparent hover:ring-stone-200 transition-colors"
                title="Pengaturan"
              >
                <span class="sr-only">Pengaturan</span>
                <i class="fas fa-cog text-lg"></i>
              </a>
            </nav>
          </div>
        </aside>

        <main class="flex-1 p-6 md:p-8">
          <header
            class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pb-6 border-b border-stone-200"
          >
            <div>
              <h1
                class="font-serif text-2xl sm:text-3xl text-stone-900 tracking-tight text-balance"
              >
                Analisis Langsung
              </h1>
              <p class="text-sm text-stone-600 leading-relaxed">
                Arahkan tangan Anda ke kamera untuk memulai deteksi.
              </p>
            </div>
            <div class="flex items-center gap-3">
              <button
                class="inline-flex items-center gap-2 px-4 py-2 rounded-lg text-sm text-stone-700 ring-1 ring-stone-300 hover:bg-stone-100 transition-colors"
                type="button"
              >
                <i class="fas fa-share-alt text-stone-600"></i>
                <span>Bagikan</span>
              
            </div>
          </header>

          <section class="grid grid-cols-1 lg:grid-cols-3 gap-6 md:gap-8 mt-6">
            <div
              class="lg:col-span-2 bg-white rounded-xl ring-1 ring-stone-200 shadow-sm p-5 md:p-6"
            >
              <div class="flex items-center justify-between mb-4">
                <h2 class="font-serif text-xl text-stone-900">
                  Kamera Langsung
                </h2>
                <div class="flex items-center gap-3">
                  <span
                    id="recordingIndicator"
                    class="inline-flex items-center gap-2 rounded-full px-3 py-1 text-xs font-medium ring-1 ring-stone-200"
                    aria-live="polite"
                  >
                    <span class="relative inline-flex size-2">
                      <span
                        class="absolute inset-0 rounded-full bg-rose-500/90"
                      ></span>
                      <span
                        class="absolute inset-0 rounded-full bg-rose-500/90 animate-ping"
                      ></span>
                    </span>
                    <span class="text-stone-700">Rekaman</span>
                  </span>
                  <button
                    id="toggleCameraBtn"
                    class="inline-flex items-center justify-center size-10 rounded-full text-stone-700 ring-1 ring-stone-300 hover:bg-stone-100 transition-colors"
                    type="button"
                    aria-label="Aktifkan/Nonaktifkan kamera"
                  >
                    <i class="fas fa-video"></i>
                  </button>
                </div>
              </div>

              <div
                class="relative aspect-video rounded-lg overflow-hidden ring-1 ring-stone-200 bg-stone-100"
              >
                <video
                  id="webcam"
                  class="w-full h-full object-cover"
                  autoplay
                  muted
                  playsinline
                  width="640"
                  height="480"
                ></video>
                <canvas
                  id="output_canvas"
                  class="absolute inset-0 w-full h-full"
                  width="640"
                  height="480"
                ></canvas>
              </div>
            </div>

            <div
              class="bg-white rounded-xl ring-1 ring-stone-200 shadow-sm p-5 md:p-6 flex flex-col"
            >
              <h2
                class="font-serif text-xl text-stone-900 mb-4 pb-4 border-b border-stone-200"
              >
                Skor Prediksi
              </h2>

              <div
                class="flex flex-col items-center justify-center text-center flex-1"
              >
                <p class="text-xs uppercase tracking-widest text-stone-500">
                  Gestur terdeteksi
                </p>
                <div class="mt-3">
                  <span
                    id="result"
                    class="block text-5xl md:text-6xl font-semibold text-stone-900 leading-none"
                    >Menunggu…</span
                  >
                </div>
              </div>

              <div class="w-full h-48 mt-4">
                <canvas
                  id="predictionChart"
                  aria-label="Grafik skor prediksi"
                  role="img"
                ></canvas>
              </div>
            </div>
          </section>
        </main>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
      crossorigin="anonymous"
    ></script>
    <script src="/static/script.js"></script>
  </body>
</html>
